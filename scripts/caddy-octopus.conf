# ==============================================================================
# Octopus 站点块 —— 追加到服务器 /etc/caddy/Caddyfile 末尾
#
# 【域名】octopus.cyber-nest.com 目前没有 DNS 解析记录（getent/解析均为空）；
#         已解析到本机的是 octopus.cyber-nest.cn -> 123.57.67.108，故站点行先用 .cn。
#         若确实要用 .com，请先在 DNS 加 A 记录指向 123.57.67.108，再把下面第一行
#         octopus.cyber-nest.cn 改成 octopus.cyber-nest.com（其余内容不变）。
#
# 【版本】服务器 Caddy 2.6.2，基础认证指令名为 basicauth；
#         Caddy 2.8+ 已改名为 basic_auth，届时改这一行即可。
#
# 【生效步骤】（需要 sudo，服务器上 sudo 要密码）
#   scp 后：
#     sudo cp /home/huang/octopus/caddy-octopus.conf /tmp/octopus.conf
#     sudo tee -a /etc/caddy/Caddyfile < /tmp/octopus.conf
#     sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#     sudo systemctl reload caddy
#
# 【账号】huang + 密码（bcrypt cost 11）。改密码：
#     caddy hash-password --plaintext '新密码' --algorithm bcrypt --bcrypt-cost 11
#   把输出替换掉下面的哈希即可。
# ==============================================================================

octopus.cyber-nest.cn {
	encode zstd gzip

	# 全站基础认证：静态页 + /api 都要过这一关
	# 注意：这里必须填 bcrypt 哈希，不能填明文密码 —— 填明文会被 Caddy 当成
	# base64 哈希去解码，报 "base64-decoding password: illegal base64 data"。
	basicauth {
		huang $2a$11$gsCNSgTZ5HbBy5wBF7yDeOt83FDB2fI06jZfRSbv1DhXqOZ6feuiu
	}

	# Vite 产物文件名带 hash：前端静态资源强缓存
	@assets path /assets/*
	header @assets Cache-Control "public, max-age=31536000, immutable"

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
	}

	# 后端 API（SSE 流式响应 Caddy 会自动关闭缓冲，无需额外配置）
	handle /api/* {
		reverse_proxy 127.0.0.1:8787
	}

	# SPA 前端（vue-router history 模式：未命中的路径回落 index.html）
	handle {
		root * /home/huang/octopus/web
		try_files {path} /index.html
		file_server
	}

	log {
		output file /var/log/caddy/octopus.log
	}
}
