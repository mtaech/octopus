<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>故事书编辑器原型 · 坠星谷 — wayfinder #07</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b2230; --line:#262f3f;
    --ink:#e8edf5; --muted:#8b97a8; --accent:#6ea8ff; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
  #topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
  #topbar .badge{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  #topbar .title{font-weight:700;white-space:nowrap}
  #topbar .spacer{flex:1}
  #topbar button{background:transparent;border:1px solid var(--line);color:var(--ink);padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans)}
  #topbar button:hover{border-color:var(--accent)}
  #view{position:absolute;top:46px;left:0;right:0;bottom:0;overflow:hidden}
  .variant{display:none;height:100%}
  body[data-variant="A"] .variant.A{display:flex}
  body[data-variant="B"] .variant.B{display:flex}
  body[data-variant="C"] .variant.C{display:flex}
  #switchbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;background:#0b0e14;border:1px solid #334155;border-radius:999px;padding:6px 12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #switchbar .sw-arrow{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:transparent;color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #switchbar .sw-arrow:hover{border-color:var(--accent)}
  #switchbar .sw-label{font-size:12px;color:var(--muted);min-width:190px;text-align:center}
  #switchbar .sw-label b{color:var(--ink);font-size:13px}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:46vw;min-width:480px;background:#0a0d12;border-left:1px solid var(--line);z-index:60;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
  #drawer.open{transform:translateX(0)}
  #drawer header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  #drawer pre{flex:1;overflow:auto;padding:14px 16px;font-family:var(--mono);font-size:12px;color:#a8f0c0;white-space:pre;line-height:1.55}
  .A{flex-direction:column}
  .A .atop{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .A .atop .crumb{color:var(--muted);font-size:12.5px}
  .A .atop .crumb b{color:var(--ink)}
  .A .atop input[type=search]{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:5px 10px;font-size:12.5px;width:200px}
  .A .abody{flex:1;display:flex;min-height:0}
  .A .atree{width:230px;border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:8px 0}
  .A .sec{padding:2px 0}

  .A .sec>button.secname:hover{color:var(--ink)}
  .A .sec .cnt{color:var(--muted);background:rgba(255,255,255,.06);border-radius:99px;padding:0 7px;font-size:10.5px}
  .A .node{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 26px;cursor:pointer;font-size:13px;color:var(--ink);border-left:2px solid transparent}
  .A .node:hover{background:rgba(255,255,255,.04)}
  .A .node.sel{background:rgba(110,168,255,.12);border-left-color:var(--accent)}
  .A .node .ty{width:16px;text-align:center;font-size:12px;color:var(--muted)}
  .A .aform{flex:1;overflow:auto;padding:18px 26px;max-width:760px}
  .A .fhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .A .fhead h2{font-size:20px}
  .A .fhead .ktag{font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:4px}
  .A .fhead .del{margin-left:auto;color:var(--muted);background:none;border:none;cursor:pointer;font-size:12px}
  .A .fhead .del:hover{color:var(--err)}
  .A .fsub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .A .fsec{margin:18px 0 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
  .A .frow{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;align-items:start;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .A .frow label{color:var(--muted);font-size:12.5px;padding-top:5px}
  .A .frow input,.A .frow select,.A .frow textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:5px 9px;font-size:13px;font-family:var(--sans);width:100%}
  .A .frow textarea{min-height:74px;resize:vertical;line-height:1.55}

  .A table.edges{width:100%;border-collapse:collapse;font-size:12.5px}
  .A table.edges th{color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11.5px}
  .A table.edges td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
  .A table.edges .val{font-family:var(--mono)}
  .A .addrow{display:flex;gap:8px;margin-top:10px}
  .A .addrow select,.A .addrow input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:5px 9px;font-size:12.5px}
  .A .addrow button{background:var(--accent);border:none;color:#08111f;font-weight:700;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px}
  .A .arail{width:260px;border-left:1px solid var(--line);overflow:auto;background:var(--panel);padding:12px 14px}
  .A .railh{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin:14px 0 8px}
  .A .railh:first-child{margin-top:0}
  .A .warnitem{display:flex;gap:8px;font-size:12px;padding:6px 8px;border-radius:6px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);color:#fcd34d;margin-bottom:6px}
  .A .okitem{display:flex;gap:8px;font-size:12px;padding:6px 8px;border-radius:6px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.2);color:#86efac;margin-bottom:6px}
  .A .refitem{font-size:12px;color:var(--ink);padding:5px 8px;border-radius:6px;background:var(--panel2);margin-bottom:6px}
  .A .refitem small{display:block;color:var(--muted)}
  .A .addbtn{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;width:100%;margin-top:4px}
  .A .addbtn:hover{color:var(--accent);border-color:var(--accent)}
  .B{flex-direction:row}
  .B .bpagelist{width:216px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 0}
  .B .bgrp{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;padding:10px 16px 4px}
  .B .bpage{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;font-size:13px;color:var(--ink);border-left:2px solid transparent}
  .B .bpage:hover{background:rgba(255,255,255,.04)}
  .B .bpage.sel{background:rgba(255,255,255,.05);border-left-color:#e8b34b}
  .B .bpage .ic{width:18px;text-align:center;font-size:12px;color:var(--muted)}
  .B .bpage .n{color:var(--muted);margin-left:auto;font-size:11px}
  .B .bdoc{flex:1;overflow:auto;padding:34px 0 60px}
  .B .bdoc .page{max-width:680px;margin:0 auto;padding:0 28px}
  .B .bdoc h1{font-size:28px;margin-bottom:4px;font-weight:800}
  .B .bdoc .docmeta{color:var(--muted);font-size:12.5px;margin-bottom:22px;display:flex;gap:10px;flex-wrap:wrap}
  .B .bdoc .docmeta .chip{background:rgba(255,255,255,.06);padding:2px 9px;border-radius:99px;font-size:11.5px}
  .B .prose{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:15.5px;line-height:1.85;color:#dbe3ee;margin-bottom:20px}
  .B .prose p{margin-bottom:14px}
  .B .slashhint{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:18px 0;text-align:center}
  .B .slashhint kbd{background:rgba(255,255,255,.08);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px}
  .B .block{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
  .B .block .bhead{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px}
  .B .block .bhead .drag{color:#475569;letter-spacing:1px}
  .B .block .bhead .r{margin-left:auto;font-weight:500;color:#475569}
  .B .block .brow{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}
  .B .block .brow:last-child{border-bottom:none}
  .B .block .brow .k{width:90px;color:var(--muted);font-size:12px}

  .B .block .brow .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e8b34b,#f0c96a);border-radius:3px}
  .B .mention{display:inline-flex;align-items:center;gap:4px;background:rgba(232,179,75,.14);border:1px solid rgba(232,179,75,.35);color:#f3d18b;border-radius:6px;padding:0 7px;font-size:13px;font-weight:600}
  .B .cardrow{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
  .B .minicard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex:1;min-width:150px}
  .B .minicard .t{font-weight:700;font-size:13.5px;margin-bottom:4px}
  .B .minicard .d{color:var(--muted);font-size:12px}
  .B .backlinks{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
  .B .backlinks .bl{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:4px 6px 0 0;font-size:12px;color:var(--ink)}
  .C{flex-direction:row}
  .C .cleft{width:320px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .C .cchat{flex:1;overflow:auto;padding:14px}
  .C .cmsg{font-size:13px;margin-bottom:12px;line-height:1.6}
  .C .cmsg.user{text-align:right}
  .C .cmsg.user .bubble{display:inline-block;background:#2b3a55;border-radius:12px 12px 3px 12px;padding:8px 12px;text-align:left}
  .C .cmsg.ai .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 12px}
  .C .cmsg .who{font-size:10.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.3px}
  .C .cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .C .cin input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 12px;font-size:13px}
  .C .cin button{background:#a78bfa;border:none;color:#150b2e;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .C .cright{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto}
  .C .cprog{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .C .cprog .pg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .C .cprog .pbar{width:70px;height:5px;border-radius:3px;background:#2a3550;position:relative;overflow:hidden}
  .C .cprog .pbar i{position:absolute;left:0;top:0;bottom:0;background:#a78bfa;border-radius:3px}
  .C .cprog .advice{margin-left:auto;font-size:12px;color:var(--warn)}
  .C .ccards{flex:1;overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
  .C .gencard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .C .gencard.done{border-color:rgba(74,222,128,.4)}
  .C .gencard .ghead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .C .gencard .ghead .t{font-weight:700;font-size:14px}
  .C .gencard .ghead .tag{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--muted)}
  .C .gencard .ghead .tag.gen{background:rgba(167,139,250,.15);color:#c4b5fd}
  .C .gencard .gbody{padding:12px 14px;font-size:13px;color:var(--ink);flex:1}
  .C .gencard .gbody .row{display:flex;gap:8px;margin-bottom:7px;font-size:12.5px}
  .C .gencard .gbody .row .k{color:var(--muted);min-width:66px}
  .C .gencard .gactions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .C .gencard .gactions button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer}
  .C .gencard .gactions .adopt{background:#4ade80;border-color:#4ade80;color:#08110b;font-weight:700}
  .C .gencard .gactions button:hover{border-color:#a78bfa}
  .C .csuggest{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:10px 14px;margin:12px 18px;font-size:12.5px;color:#c4b5fd}
  .C .csuggest b{color:#ddd6fe}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2a3550;border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
</style>

<script>
"use strict";
/* =====================================================================
   PROTOTYPE · wayfinder #07 故事书编辑器设计
   三个范式的对比原型：A 表单驱动 / B 类 Notion 文档 / C AI 结对创作。
   数据取自「故事书数据模型」票（#01）的结论。
   ===================================================================== */

const S = {
  meta:{title:"坠星谷",version:"0.3.0",author:"佚名",language:"zh-CN",
    desc:"天穹裂隙倾泻「星烬」，谷中万物因之畸变与赋灵。玩家扮演拾烬人，在星烬枯竭前找到出路。"},
  world:{
    premise:"三百年前，天穹撕开一道裂隙，「星烬」如雪飘落。凡沾星烬之物皆得畸变或赋灵：灯草会发光，铁器会低语，死去的人偶尔会在月下站起。镇子依矿而生，如今矿脉将尽，裂隙却越裂越宽。",

    rules:["星烬既是货币也是施法材料，一次判定可燃烧星烬换取加值","拾烬人之间的口头约定优先于字面契约","裂隙教团以「重开裂隙」为终极目标"],
    locations:[
      {id:"loc-baiquan",name:"白泉镇",type:"小镇",desc:"坠星谷唯一的聚居地，白泉井是全镇生命线。",factions:["fa-shijin"]},
      {id:"loc-liexi",name:"裂隙山口",type:"地标",desc:"天穹裂隙的正下方，星烬密度最高的禁区。",factions:["fa-liexi"]},
      {id:"loc-kuang",name:"沉星矿坑",type:"矿场",desc:"已近枯竭的星烬矿坑，传闻坑底有「星核」。",factions:[]},
      {id:"loc-shuangyu",name:"霜语林",type:"林地",desc:"入夜后树木会低语，误入者易迷失。",factions:[]}
    ],
    resources:[
      {id:"res-xingjin",name:"星烬",desc:"星尘凝结的货币与施法材料。",initial:100},
      {id:"res-tili",name:"体力",desc:"行动与战斗的消耗。",initial:80},
      {id:"res-mana",name:"法力",desc:"施法消耗。",initial:60}

  skeleton:{chapters:[
    {id:"ch1",title:"第一章 · 余烬将熄",goal:"查明镇长失踪的真相，在星烬枯竭前找到出路",scenes:[
      {id:"sc1",title:"白泉镇的夜",entry:"玩家在入夜后抵达白泉镇",exit:"获得阿彻的信任或发现镇长的线索",
        goals:[{id:"g1",text:"让阿彻愿意开口"}],
        beats:[
          {id:"b1",title:"烛火熄灭",trigger:"玩家夜巡经过镇长家时",once:true,hint:"镇长家的蜡烛骤然熄灭，屋内传来压抑的低语——这是本场景的第一条线索。",done:false},
          {id:"b2",title:"遇见阿彻",trigger:"玩家在钟楼下或酒馆遇见守夜人阿彻",once:true,hint:"阿彻态度冷淡，给玩家一个「信任」判定机会。",done:false},
          {id:"b3",title:"星烬异象",trigger:"玩家主动观察裂隙方向",once:false,hint:"裂隙方向的天幕闪烁了一下，像心跳。",done:false}
        ]}
    ]}
  ]},
  characters:[
    {id:"ch-ache",name:"阿彻",role:"守夜人",home:"loc-baiquan",faction:"fa-shijin",

const $ = id => document.getElementById(id);
const byId = (id,list) => list.find(x=>x.id===id) || {name:"(未引用)",id};
const relName = id => {
  if(id.startsWith("ch-")) return byId(id,S.characters).name;
  if(id.startsWith("fa-")) return byId(id,S.factions).name;
  if(id.startsWith("loc-")) return byId(id,S.world.locations).name;
  return id;
};

function render(){

/* =====================================================================
   VARIANT A — 表单工作台（资料库模式）
   ===================================================================== */
let Astate = { sel:"ch-ache" };
function treeNodes(){
  return [
    ["meta","信息",[{id:"meta",name:"故事书信息"}]],
    ["world","世界",[{id:"world-premise",name:"设定与规则"},{id:"world-loc",name:"地点"},{id:"world-res",name:"资源"}]],
    ["dim","属性维度",[{id:"dim",name:"全局属性"}]],
    ["skel","骨架",[{id:"skel",name:"章节 / 场景"}]],
    ["char","人物",S.characters],
    ["skill","技能",S.skills],
    ["item","物品",S.items],
    ["fac","势力",S.factions],
    ["rel","关系",[{id:"rel",name:"关系图"}]]
  ];
}
function validation(entity){
  const warns=[];
  if(entity && entity.faction && !S.factions.find(f=>f.id===entity.faction))
    warns.push("引用失效：势力不存在");
  if(entity && entity.skills && entity.skills.some(s=>!S.skills.find(x=>x.id===s)))
    warns.push("引用失效：技能不存在");
  if(entity && entity.home && !S.world.locations.find(l=>l.id===entity.home))
    warns.push("引用失效：地点不存在");
  return warns;
}
function field(label,html,hint){
  return '<div class="frow"><label>'+label+'</label><div>'+html+(hint?'<div class="hint">'+hint+'</div>':"")+'</div></div>';
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function drawA(){
  const root=document.createElement("div"); root.className="variant A";
  root.innerHTML=''+
    '<div class="atop"><span class="crumb">坠星谷 <b id="acrumb"></b></span>'+
    '<input type="search" placeholder="搜索 人物/技能/物品…" id="a-search">'+
    '<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#86efac">● 已自动保存</span></div>'+
    '<div class="abody"><div class="atree" id="a-tree"></div><div class="aform" id="a-form"></div><div class="arail" id="a-rail"></div></div>';
  $("view").appendChild(root);
  drawTree(); drawAForm(); drawRail();
  $("a-search").addEventListener("input",e=>{ $("a-search").dataset.q=e.target.value; drawTree(); });
}
function drawTree(){
  const tree=$("a-tree"); if(!tree) return; tree.innerHTML="";
  const q=($("a-search")||{}).dataset?.q||"";
  treeNodes().forEach(([sk,label,items])=>{
    const sec=document.createElement("div"); sec.className="sec";
    const hdr=document.createElement("button"); hdr.className="secname";
    hdr.innerHTML='<span>'+label+'</span><span class="cnt">'+items.length+'</span>';
    sec.appendChild(hdr);
    items.forEach(it=>{
      if(q && !(it.name||"").includes(q) && !(it.title||"").includes(q) && !(it.id||"").includes(q)) return;
      const n=document.createElement("div"); n.className="node"+(Astate.sel===it.id?" sel":"");
      const ic = sk==="char"?"👤":sk==="skill"?"✦":sk==="item"?"📦":sk==="fac"?"🏛️":sk==="world"?(it.id==="world-premise"?"📜":it.id==="world-loc"?"📍":"💎"):"•";
      n.innerHTML='<span class="ty">'+ic+'</span><span>'+esc(it.name||it.title||it.id)+'</span>';
      n.onclick=()=>{ Astate={sel:it.id,kind:sk}; drawTree(); drawAForm(); drawRail(); };
      sec.appendChild(n);
    });
    tree.appendChild(sec);
  });
}
function renderA(){
  drawA();
}
function AformHTML(sel){
  if(sel==="meta") return metaForm();
  if(sel==="dim") return dimForm();
  if(sel==="skel") return skelForm();
  if(sel==="rel") return relForm();
  if(sel==="world-premise") return premiseForm();
  if(sel==="world-loc") return locListForm();
  if(sel==="world-res") return resListForm();
  if(sel.startsWith("ch-")) return charForm(sel);
  if(sel.startsWith("sk-")) return skillForm(sel);
  if(sel.startsWith("it-")) return itemForm(sel);
  if(sel.startsWith("fa-")) return facForm(sel);
  return "";
}
function drawAForm(){
  $("a-form").innerHTML = AformHTML(Astate.sel||"ch-ache");
  $("a-form").querySelectorAll("[data-meta]").forEach(i=>i.onchange=()=>{S.meta[i.dataset.meta]=i.value});
  $("a-form").querySelectorAll("[data-char]").forEach(i=>i.onchange=()=>{byId(i.dataset.char,S.characters)[i.dataset.k]=i.value; drawRail();});
  $("a-form").querySelectorAll("[data-skill]").forEach(i=>i.onchange=()=>{byId(i.dataset.skill,S.skills)[i.dataset.k]=i.value});
  $("a-form").querySelectorAll("[data-item]").forEach(i=>{const it=byId(i.dataset.item,S.items); it[i.dataset.k]=i.value;});
  $("a-form").querySelectorAll("[data-fac]").forEach(i=>i.onchange=()=>{byId(i.dataset.fac,S.factions)[i.dataset.k]=i.value});
  const addsk=$("it-addskill");
  if(addsk) addsk.onchange=()=>{ const v=addsk.value; if(v){ byId(Astate.sel,S.items).skills.push(v); drawAForm(); drawRail(); } };
}
function drawRail(){
  const rail=$("a-rail"); if(!rail) return;
  const sel=Astate.sel||"";
  const isEntity = sel.startsWith("ch-")||sel.startsWith("sk-")||sel.startsWith("it-")||sel.startsWith("fa-");
  const all=[...S.characters,...S.skills,...S.items,...S.factions];
  const ent = isEntity ? byId(sel,all) : null;
  const warns = ent?validation(ent):[];
  let html='<div class="railh">引用完整性</div>';
  if(!ent){ html+='<div class="okitem">✓ 容器 / 列表，无引用校验</div>'; }
  else if(warns.length===0){ html+='<div class="okitem">✓ 所有引用有效</div>'; }
  else warns.forEach(w=>html+='<div class="warnitem">⚠ '+esc(w)+'</div>');
  html+='<div class="railh">被引用（谁在用它）</div>';
  if(ent){
    const refs=[];
    S.skills.forEach(s=>{ if(s.cost&&s.cost.resource===sel) refs.push('技能「'+s.name+'」消耗此资源'); });
    S.items.forEach(it=>{ if(it.skills.includes(sel)) refs.push('物品「'+it.name+'」引用此技能'); });
    S.relationships.forEach(r=>{ if(r.from===sel||r.to===sel) refs.push('关系「'+relName(r.from)+' → '+relName(r.to)+'」'); });
    S.characters.forEach(c=>{ if(c.faction===sel) refs.push('人物「'+c.name+'」隶属'); });
    if(refs.length===0) html+='<div class="okitem">✓ 无引用</div>';
    else refs.slice(0,6).forEach(r=>html+='<div class="refitem">↪ '+esc(r)+'</div>');
  }
  html+='<div class="railh">最近修改</div><div class="refitem"><small>刚刚</small>米拉 · 阵营 → 中立</div><div class="refitem"><small>8 分钟前</small>新增 beat · 星烬异象</div>';
  rail.innerHTML=html;
}

window.addDim=()=>{
  const k=$("dim-key").value.trim(), l=$("dim-label").value.trim(), t=$("dim-type").value;
  if(!k||!l){ alert("原型：请填写键与标签"); return; }
  const d={key:k,label:l,type:t};
  if(t==="number"){ d.min=0; d.max=100; }
  if(t==="enum"){ d.options=["选项A"]; }
  S.dimensions.push(d);
  S.characters.forEach(c=>{ c.attributes[k]= t==="text"?"":(t==="enum"?d.options[0]:50); });
  drawTree(); drawAForm(); drawRail();
};
window.delDim=k=>{
  const used=S.characters.some(c=>c.attributes[k]!==undefined);
  if(used){ alert("原型：该维度已被人物引用，引擎端将拒绝删除——请先移除人物取值。"); return; }
  S.dimensions=S.dimensions.filter(d=>d.key!==k); drawTree(); drawAForm();
};
window.setAttr=(cid,key,val)=>{ const c=byId(cid,S.characters); c.attributes[key]= Number.isNaN(+val)?val:+val; };
window.delChar=id=>{ if(confirm("原型：删除人物？关联的关系边会一并清理。")){ S.characters=S.characters.filter(c=>c.id!==id); S.relationships=S.relationships.filter(r=>r.from!==id&&r.to!==id); Astate={sel:"char"}; drawTree(); drawAForm(); drawRail(); } };
window.delRel=i=>{ S.relationships.splice(i,1); drawAForm(); drawRail(); };
window.addRel=()=>{
  const f=$("rel-from").value, t=$("rel-to").value, ty=$("rel-type").value.trim(), v=+$("rel-value").value;
  if(!f||!t||!ty){ alert("原型：请填写主体、客体与关系类型"); return; }

};

  Object.entries(seed).forEach(([id,item])=>{
    const done = !!Cstate.adopted[id];
    const card=document.createElement("div"); card.className="gencard"+(done?" done":"");
    card.innerHTML='<div class="ghead"><span class="t">'+esc(item.title)+'</span><span class="tag '+(done?"":"gen")+'">'+(done?"已采纳":"待审查 · 生成")+'</span></div>'+
      '<div class="gbody">'+item.rows.map(r=>'<div class="row"><span class="k">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join("")+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">'+esc(item.extra)+'</div></div>'+
      '<div class="gactions">'+(done
        ? '<button disabled style="opacity:.6">✓ 已写入故事书</button><button onclick="alert(\'原型：打开该实体编辑\')">✎ 手动微调</button>'
        : '<button class="adopt" onclick="adoptCard(\''+id+'\')">✓ 采纳</button><button onclick="alert(\'原型：重新生成该卡片\')">↻ 重写</button><button onclick="alert(\'原型：打开卡片编辑器\')">✎ 编辑</button>')+'</div>';
    cards.appendChild(card);
  });
  const inp=$("c-input");
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") sendChat(); });
  $("c-send").onclick=sendChat;
}
window.adoptCard=id=>{ Cstate.adopted[id]=true; renderC(); };
function sendChat(){
  const inp=$("c-input"); const v=inp.value.trim(); if(!v) return;
  Cstate.chats.push({who:"user",text:v});
  Cstate.chats.push({who:"ai",text:'好的，已据「'+esc(v)+'」生成 <strong>一组新卡片</strong>，请到右侧审查。要我沿着某个方向继续，就说一声。'});
  inp.value="";
  renderC();
}
initC();

/* =====================================================================
   SWITCHER + DRAWER
   ===================================================================== */
const VINFO={A:"A — 表单工作台",B:"B — 文档工作台",C:"C — AI 结对创作"};
function setVariant(v){
  if(!VINFO[v]) v="A";
  const url=new URL(location.href); url.searchParams.set("variant",v); history.replaceState(null,"",url);
  document.body.dataset.variant=v; render();
}
$("sw-prev").onclick=()=>setVariant({A:"C",B:"A",C:"B"}[document.body.dataset.variant]);
$("sw-next").onclick=()=>setVariant({A:"B",B:"C",C:"A"}[document.body.dataset.variant]);
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select,[contenteditable]")) return;
  if(e.key==="ArrowLeft") setVariant({A:"C",B:"A",C:"B"}[document.body.dataset.variant]);
  if(e.key==="ArrowRight") setVariant({A:"B",B:"C",C:"A"}[document.body.dataset.variant]);
});
$("btn-json").onclick=()=>{ $("drawer-pre").textContent=JSON.stringify(S,null,2); $("drawer").classList.add("open"); };
$("drawer-close").onclick=()=>$("drawer").classList.remove("open");

setVariant(new URL(location.href).searchParams.get("variant")||"A");
</script>
