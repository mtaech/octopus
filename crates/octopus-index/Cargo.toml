[package]
name = "octopus-index"
version.workspace = true
edition.workspace = true

[dependencies]
octopus-engine = { path = "../octopus-engine" }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# DuckDB 向量库（#27）：bundled 自带 C++ 源码，无需系统安装 libduckdb。
# 派生数据、可重建；不参与权威路径。
duckdb = { version = "1.10505.0", features = ["bundled"] }

[dev-dependencies]
octopus-types = { path = "../octopus-types" }
tempfile = "3"
